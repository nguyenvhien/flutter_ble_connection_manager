name: flutter_ble_connection_manager
description: >-
  Reliable BLE connection lifecycle management for FlutterBluePlus —
  setup, readiness, cancellation, retries and reconnects.
version: 0.2.2
homepage: https://github.com/nguyenvhien/flutter_ble_connection_manager
repository: https://github.com/nguyenvhien/flutter_ble_connection_manager

environment:
  sdk: ^3.4.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.0
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.3
